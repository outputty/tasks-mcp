# trails/chore/bootstrap.trail.yaml - the per-branch spec thought-trail. SPEC writes it; PLAN and BUILD read it.
core_objective: |
  Bootstrap outputty product memory for this brownfield repo: reconstruct all six record sets
  (product, roadmap, architecture, tasks via the tasks MCP server, lessons, examples) from what
  the repo already knows, verify every shipped claim by a run, then confirm the gaps with a
  targeted grilling. No planning, no building.
decisions:
  - question: What did the user check as scan depth?
    answer: Deep commit + diff scan only (docs/docstrings/messages boxes left unchecked); the diff scan ran on outputty-reviewer, messages read inline.
    link: .claude/trails/chore/bootstrap.trail.yaml
  - question: How does one day of history become roadmap rows?
    answer: One row per npm-version-scale target, five rows, all shipped, each with a writeup doc.
    link: .claude/roadmap.yaml
  - question: Where do bootstrap-found debt items live?
    answer: Filed live through the tracker itself (dogfooding) — eight tasks, issues 13-20 on outputty/tasks-mcp, board "Tasks" number 2 provisioned by the first add.
    link: https://github.com/outputty/tasks-mcp/issues
  - question: How are shipped claims verified?
    answer: By runs — npm run check green (53 tests); CLI reads on a seeded canonical graph via the public FileProvider API; the MCP server driven over real HTTP by the SDK client; a live add/sync round-trip on this repo; npm registry queried for the published versions.
    link: .claude/examples.yaml
  - question: oxfmt rejects the plugin-managed CLAUDE.md block and .claude/ files — format or exclude?
    answer: Exclude via .prettierignore (oxfmt reads it): the block is replaced byte-for-byte by init re-runs, so formatting it would make every re-run fail CI.
    link: .prettierignore
  - question: Does Linear get a planned roadmap row?
    answer: No. The types.ts 'linear' mention was an illustration of how layers work, not a plan. No row; the REMOTES table stays the extension point.
    link: src/core/types.ts:79
  - question: What is the North Star, in the user's own framing?
    answer: A proxy for agentic task management that enhances cross-session task management — the agent takes over task management entirely, one or more connected external providers hold the backup, and a local copy of the tasks gives enhanced dependency resolution. product.yaml reworded around this.
    link: .claude/product.yaml
  - question: ProjectContext.branch — implement or remove?
    answer: Remove. Never read in 16 commits, no design for branch scoping, optional field so no well-behaved caller breaks. Task unused-branch-param amended with the ruling and flipped to spec settled via a live label edit + sync (the round-trip exercised for real on issue 17).
    link: https://github.com/outputty/tasks-mcp/issues/17
not_yet_specified:
  - item: Should kind be settable at add, or leave the model?
    reason: Q4 of the grill round — user asked for the justification; worked example presented, answer pending.
out_of_scope:
  - item: New features, refactors, or fixes to the codebase itself
    reason: Bootstrap only reconstructs memory of what exists; task-shaped findings are filed as tasks, not built.
