name: Publish

# Release management is manual and separate from pushing code. Pushing to a branch runs CI (see ci.yml)
# but never publishes. Publishing happens only when you manually create a GitHub Release: tag it
# `vX.Y.Z` to match package.json, and publishing this release fires the `release: published` event below.
#
# Auth is npm Trusted Publishing (OIDC) — no token is stored. Configure a Trusted Publisher on the
# package (npmjs → Settings → Publishing) pointing at this repo + this workflow. Provenance is attached
# automatically. Note: OIDC cannot do a package's FIRST publish — do that one by hand.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the OIDC identity npm trusts — replaces a stored NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Release tag must match package.json, and version must be new
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "release tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::release tag $TAG != package.json $PKG"; exit 1; }
          if npm view "@outputty/tasks-mcp@$PKG" version >/dev/null 2>&1; then
            echo "::error::@outputty/tasks-mcp@$PKG is already published"; exit 1
          fi
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish # OIDC: no NODE_AUTH_TOKEN, provenance automatic
