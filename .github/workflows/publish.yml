name: Publish

# Publishing is manual and deliberate: it runs ONLY when you push a version tag (`vX.Y.Z`). Nothing
# publishes on a branch push or a PR.
#
#   npm version patch          # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags     # pushes the commit and the tag -> this workflow runs
#
# Auth is npm Trusted Publishing (OIDC) — no token is stored. Configure a Trusted Publisher on the
# package (npmjs -> Settings -> Publishing) pointing at this repo + this workflow. Provenance is
# attached automatically. Note: OIDC cannot do a package's FIRST publish — do that one by hand.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # the OIDC identity npm trusts — replaces a stored NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish # OIDC: no NODE_AUTH_TOKEN, provenance automatic
