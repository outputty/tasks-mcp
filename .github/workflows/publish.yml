name: Publish

# Publishing is a deliberate act: it runs only when you publish a GitHub Release (tag it `vX.Y.Z`,
# matching package.json). Nothing publishes on a plain push.
#
# Auth is npm Trusted Publishing (OIDC) — no token is stored. GitHub Actions proves its identity to npm
# via a short-lived OIDC token, so you configure a Trusted Publisher on the package (Settings ->
# Publishing) pointing at this repo + this workflow. Provenance is attached automatically.
# Note: OIDC cannot do a package's FIRST publish — publish v0.5.0 once by hand, then this takes over.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the OIDC identity npm trusts — replaces a stored NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish # OIDC: no NODE_AUTH_TOKEN, provenance automatic
