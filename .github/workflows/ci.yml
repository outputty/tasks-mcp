name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 26, not 24: the --tui console runs on @opentui/core, whose renderer needs Node 26.4+ and
          # --experimental-ffi (passed to the test workers by vitest.config.ts). The package's engines
          # floor moved to match. tsdown/unrun still work here — Node 26 has Promise.withResolvers.
          node-version: 26
          cache: npm
      - run: npm ci
      # The one build command — identical to what runs locally, so CI can never drift from `npm run check`.
      - run: npm run check
