<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 576" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="ttl">Per-task trail: append and read flow</title>
  <desc id="dsc">append_trail guards that the task exists in the top file layer, then text-appends one entry to .trails/&lt;id&gt;.yaml; get_trail reads the whole journal back, oldest first. Trails are local and never synced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .band{font-size:11px;font-weight:700;fill:#534AB7;letter-spacing:.06em}
    .th{font-size:13px;font-weight:600;fill:#2C2C2A}
    .t{font-size:12px;font-weight:600;fill:#2C2C2A}
    .ts{font-size:10.5px;fill:#5F5E5A}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .chip{font-size:9.5px;font-weight:700}
    .lg{font-size:10px;fill:#5F5E5A}
    .edge{fill:none;stroke:#888780;stroke-width:1.6}
    .nbox{fill:#F3F2EF;stroke:#C9C7C0;stroke-width:1.3}
    .dia{fill:#FFFFFF;stroke:#6B5BD6;stroke-width:1.5}
    .stop{fill:#FBEBE9;stroke:#B0413E;stroke-width:1.6}
    .store{fill:#FBF6E9;stroke:#C9B98A;stroke-width:1.6}
  </style>

  <rect x="8" y="8" width="664" height="560" rx="14" fill="#FBFBF9" stroke="#E5E3DC"/>

  <!-- ============ APPEND (write path) ============ -->
  <text class="band" x="24" y="42">APPEND_TRAIL · WRITE PATH</text>
  <line x1="24" y1="49" x2="656" y2="49" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>

  <rect class="nbox" x="140" y="60" width="320" height="46" rx="16"/>
  <text class="th" x="300" y="80" text-anchor="middle">append_trail</text>
  <text class="ts mono" x="300" y="96" text-anchor="middle">{ id, kind, note, link? }</text>

  <line class="edge" x1="300" y1="106" x2="300" y2="118" marker-end="url(#arrow)"/>

  <polygon class="dia" points="300,120 366,162 300,204 234,162"/>
  <text class="t" x="300" y="158" text-anchor="middle">Task exists?</text>
  <text class="ts" x="300" y="173" text-anchor="middle">(top file layer)</text>

  <!-- no -> stop -->
  <line class="edge" x1="366" y1="162" x2="470" y2="162" marker-end="url(#arrow)"/>
  <rect x="405" y="153" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="chip" x="420" y="165" text-anchor="middle" fill="#B0413E">no</text>
  <rect class="stop" x="470" y="142" width="184" height="40" rx="18"/>
  <text class="th mono" x="562" y="166" text-anchor="middle">throw "no task &lt;id&gt;"</text>

  <!-- yes -> append -->
  <line class="edge" x1="300" y1="204" x2="300" y2="230" marker-end="url(#arrow)"/>
  <rect x="285" y="209" width="34" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="chip" x="302" y="221" text-anchor="middle" fill="#0F6E56">yes</text>

  <rect class="nbox" x="140" y="232" width="320" height="50" rx="8"/>
  <text class="th" x="300" y="252" text-anchor="middle">TrailStore.append</text>
  <text class="ts" x="300" y="269" text-anchor="middle">text append — never rewrites earlier entries</text>

  <line class="edge" x1="300" y1="282" x2="300" y2="306" marker-end="url(#arrow)"/>

  <rect class="store" x="140" y="308" width="320" height="52" rx="8"/>
  <text class="th mono" x="300" y="329" text-anchor="middle">.trails/&lt;id&gt;.yaml</text>
  <text class="ts" x="300" y="346" text-anchor="middle">YAML list · oldest first · local, never synced</text>

  <!-- ============ READ path ============ -->
  <text class="band" x="24" y="390">GET_TRAIL · READ PATH</text>
  <line x1="24" y1="397" x2="656" y2="397" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>

  <line class="edge" x1="300" y1="360" x2="300" y2="410" marker-end="url(#arrow)"/>

  <rect class="nbox" x="140" y="412" width="320" height="46" rx="8"/>
  <text class="th" x="300" y="432" text-anchor="middle">get_trail</text>
  <text class="ts" x="300" y="448" text-anchor="middle">read the file → return the list</text>

  <line class="edge" x1="300" y1="458" x2="300" y2="484" marker-end="url(#arrow)"/>

  <rect class="nbox" x="140" y="486" width="320" height="48" rx="8"/>
  <text class="th" x="300" y="506" text-anchor="middle">The whole journal, oldest first</text>
  <text class="ts mono" x="300" y="523" text-anchor="middle">[ { kind, note, link? }, … ]</text>

  <!-- legend -->
  <rect x="150" y="548" width="14" height="10" rx="2" class="nbox"/>
  <text class="lg" x="169" y="557">step</text>
  <polygon class="dia" points="212,548 222,553 212,558 202,553"/>
  <text class="lg" x="228" y="557">decision</text>
  <rect x="292" y="548" width="14" height="10" rx="5" class="stop"/>
  <text class="lg" x="311" y="557">stop</text>
  <rect x="356" y="548" width="14" height="10" rx="2" class="store"/>
  <text class="lg" x="375" y="557">durable local store</text>
</svg>
