<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" role="img">
  <title>tasks-mcp architecture: the provider stack</title>
  <desc>Clients call the MCP server or CLI, which drive the TaskStack orchestrator over a stack of
  provider layers: the file layer on top answers every read, GitHub sits beneath it, and any further
  layer below that. Writes fan down through every layer; sync pulls all layers and the deepest wins.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B5BD6" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    .band{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;fill:#534AB7;letter-spacing:.06em}
    .th{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#2C2C2A}
    .ts{font-family:system-ui,sans-serif;font-size:10.5px;fill:#5F5E5A}
    .chip{font-family:system-ui,sans-serif;font-size:9.5px;font-weight:700}
    .leg{font-family:system-ui,sans-serif;font-size:10.5px;fill:#5F5E5A}
    .nbox{fill:#F3F2EF;stroke:#C9C7C0;stroke-width:1.3}
    .file{fill:#EAF6EF;stroke:#0F6E56;stroke-width:1.6}
    .remote{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
    .future{fill:#FBFAF7;stroke:#A9A79F;stroke-width:1.3;stroke-dasharray:5 4}
  </style>

  <rect x="8" y="8" width="664" height="624" rx="12" fill="#FBFAF7" stroke="#E5E3DC"/>

  <!-- CLIENTS -->
  <text class="band" x="24" y="40">CLIENTS</text>
  <line x1="24" y1="48" x2="656" y2="48" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="60" y="62" width="270" height="48" rx="8"/>
  <text class="th" x="195" y="82" text-anchor="middle">Coding agent (MCP)</text>
  <text class="ts" x="195" y="99" text-anchor="middle">add_task · list_ready · prereqs · blockers · sync</text>
  <rect class="nbox" x="360" y="62" width="260" height="48" rx="8"/>
  <text class="th" x="490" y="82" text-anchor="middle">Human (CLI / library)</text>
  <text class="ts" x="490" y="99" text-anchor="middle">tasks-mcp blockers · import from npm</text>

  <!-- SERVER -->
  <text class="band" x="24" y="146">SERVER</text>
  <line x1="24" y1="154" x2="656" y2="154" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="60" y="168" width="270" height="48" rx="8"/>
  <text class="th" x="195" y="188" text-anchor="middle">MCP server + transports</text>
  <text class="ts" x="195" y="205" text-anchor="middle">@modelcontextprotocol/sdk · stdio · HTTP</text>
  <line x1="195" y1="110" x2="195" y2="166" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M490,110 L490,140 L644,140 L644,270 L624,270" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect class="nbox" x="60" y="244" width="560" height="52" rx="8"/>
  <text class="th" x="340" y="265" text-anchor="middle">TaskStack — the orchestrator</text>
  <text class="ts" x="340" y="282" text-anchor="middle">reads: top layer only · writes: fan down every layer · sync: merge all, deepest wins</text>
  <line x1="195" y1="216" x2="195" y2="242" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- PROVIDER STACK -->
  <text class="band" x="24" y="332">PROVIDER STACK · top = fastest, deepest = source of truth</text>
  <line x1="24" y1="340" x2="656" y2="340" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>

  <rect class="file" x="130" y="356" width="420" height="54" rx="8"/>
  <text class="th" x="340" y="378" text-anchor="middle">FileProvider — the file layer</text>
  <text class="ts" x="340" y="395" text-anchor="middle">one YAML per repo in the OS cache dir · disposable · every read stops here</text>

  <rect class="remote" x="130" y="434" width="420" height="54" rx="8"/>
  <text class="th" x="340" y="456" text-anchor="middle">GitHubProvider</text>
  <text class="ts" x="340" y="473" text-anchor="middle">issues (id in body · field:value labels) + Projects v2 board, all GraphQL</text>

  <rect class="future" x="130" y="512" width="420" height="46" rx="8"/>
  <text class="th" x="340" y="531" text-anchor="middle">next layer (Linear, …)</text>
  <text class="ts" x="340" y="547" text-anchor="middle">add it and sync backfills it — a free migration</text>

  <!-- reads: service to top layer only -->
  <line x1="180" y1="296" x2="180" y2="354" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <rect x="146" y="300" width="42" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="chip" x="167" y="311" text-anchor="middle" fill="#0F6E56">reads</text>

  <!-- writes: fan down through every layer -->
  <line x1="500" y1="296" x2="500" y2="354" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="410" x2="500" y2="432" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="488" x2="500" y2="510" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="456" y="300" width="88" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="chip" x="500" y="311" text-anchor="middle" fill="#5F5E5A">writes fan down</text>

  <!-- sync: pull every layer, deepest wins, pushed back up -->
  <path d="M130,535 L84,535 L84,270 L58,270" fill="none" stroke="#6B5BD6" stroke-width="1.6" marker-end="url(#arrowp)"/>
  <rect x="30" y="418" width="108" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="chip" x="84" y="429" text-anchor="middle" fill="#6B5BD6">sync: deepest wins</text>

  <!-- depth marker -->
  <line x1="600" y1="366" x2="600" y2="548" stroke="#A9A79F" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text class="leg" x="614" y="462" transform="rotate(90 614 462)" text-anchor="middle">deeper = more authoritative</text>

  <!-- legend -->
  <rect x="60" y="588" width="12" height="12" class="file" rx="3"/>
  <text class="leg" x="78" y="598">file layer (fast, disposable)</text>
  <rect x="238" y="588" width="12" height="12" class="remote" rx="3"/>
  <text class="leg" x="256" y="598">remote layer</text>
  <rect x="360" y="588" width="12" height="12" class="future" rx="3"/>
  <text class="leg" x="378" y="598">not built yet</text>
  <rect x="474" y="588" width="12" height="12" class="nbox" rx="3"/>
  <text class="leg" x="492" y="598">server machinery</text>
</svg>
